version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: zion-postgres
    environment:
      POSTGRES_DB: zion
      POSTGRES_USER: zion
      POSTGRES_PASSWORD: zion_dev
    ports:
      - "5432:5432"
    volumes:
      - zion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zion_pgdata:
